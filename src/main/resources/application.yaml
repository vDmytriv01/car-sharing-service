spring:
  application:
    name: car-sharing-service
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    disable-swagger-default-url: true
    operations-sorter: method
    path: /swagger-ui.html
    tags-sorter: alpha

app:
  bootstrap:
    manager:
      enabled: ${BOOTSTRAP_MANAGER_ENABLED:false}
      email: ${BOOTSTRAP_MANAGER_EMAIL:}
      first-name: ${BOOTSTRAP_MANAGER_FIRST_NAME:}
      last-name: ${BOOTSTRAP_MANAGER_LAST_NAME:}
      password: ${BOOTSTRAP_MANAGER_PASSWORD:}

security:
  jwt:
    expiration: ${JWT_EXPIRATION:1h}
    issuer: ${JWT_ISSUER:car-sharing-service}
    secret: ${JWT_SECRET}

payment:
  currency: usd
  fine-multiplier: 1.50

notification:
  telegram:
    api-url: https://api.telegram.org
  overdue-rentals:
    cron: ${OVERDUE_NOTIFICATION_CRON:0 0 9 * * *}
    zone: ${OVERDUE_NOTIFICATION_ZONE:UTC}
