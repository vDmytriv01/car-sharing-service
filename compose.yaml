name: car-sharing-service

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
    ports:
      - "127.0.0.1:${MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -u root --password="$${MYSQL_ROOT_PASSWORD}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      BOOTSTRAP_MANAGER_EMAIL: ${BOOTSTRAP_MANAGER_EMAIL:-}
      BOOTSTRAP_MANAGER_ENABLED: ${BOOTSTRAP_MANAGER_ENABLED:-false}
      BOOTSTRAP_MANAGER_FIRST_NAME: ${BOOTSTRAP_MANAGER_FIRST_NAME:-}
      BOOTSTRAP_MANAGER_LAST_NAME: ${BOOTSTRAP_MANAGER_LAST_NAME:-}
      BOOTSTRAP_MANAGER_PASSWORD: ${BOOTSTRAP_MANAGER_PASSWORD:-}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_ISSUER: ${JWT_ISSUER:-car-sharing-service}
      JWT_SECRET: ${JWT_SECRET}
      OVERDUE_NOTIFICATION_CRON: "${OVERDUE_NOTIFICATION_CRON:-0 0 9 * * *}"
      OVERDUE_NOTIFICATION_ZONE: ${OVERDUE_NOTIFICATION_ZONE:-UTC}
      SPRING_PROFILES_ACTIVE: prod
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    ports:
      - "127.0.0.1:${APP_PORT}:8080"
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --tries=1 --spider http://localhost:8080/actuator/health
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:
